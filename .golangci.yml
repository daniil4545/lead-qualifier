version: "2"

# Default set plus gosec and two exclusions. Both are deliberate, not a way around red:
# staticcheck QF checks rewrite readable code into shorter but not more
# understandable; an unchecked return in test stubs is noisy and catches nothing.
linters:
  enable:
    - gosec
  settings:
    staticcheck:
      checks:
        - all
        # The ST set is disabled by default in golangci-lint itself: these are
        # comment and name style rules, left off here.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
        - -QF1001 # De Morgan law: an explicit negation of a pair reads better
        - -QF1002 # tagged switch: the set of cases here is not over a single value
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec # tests read fixtures by variable path and drop errors in cleanups
